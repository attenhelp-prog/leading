<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Attention</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="register-wrapper">
        <div class="register-card">
       
            <div class="register-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8b7cf7" stroke-width="2">
                    <path d="M12 5v14M5 12h14" />
                </svg>
                <span>attention</span>
            </div>

            <h2 class="register-title">С возвращением</h2>
            <p class="register-subtitle">Войди в свой аккаунт</p> 
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="Email" class="input-field">
            </div>

      
            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="Пароль" class="input-field">
            </div>

            
            <button class="register-btn" id="loginBtn">Войти</button>

            
            <p class="login-link">
                Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            </p>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
