<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile</title>
    <link rel="stylesheet" href="profile1.css">
</head>
<body>
    <div>
        <a href="../feed.html">
            <button class="back">Назад</button>
        </a>
    </div>
    
    <h2 class="profile-name"><span id="profile-username">Пользователь</span></h2>
   
<div class="profile-header">
    <div class="profile-stats">
        <span class="stat-item">
            <span class="stat-label">постов</span>
            <span class="stat-number" id="statPosts">0</span>
        </span>
        <span class="stat-item">
            <span class="stat-label">лайков</span>
            <span class="stat-number" id="statLikes">0</span>
        </span>
        <span class="stat-item">
            <span class="stat-label">просм</span>
            <span class="stat-number" id="statViews">0</span>
        </span>
    </div>
</div>
    
    <div id="profile-feed"></div>
    <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
</div>

<div id="confirmOverlayProfile" class="confirm-overlay">
    <div class="confirm-box">
        <div class="confirm-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
        </div>
        <div class="confirm-title">Вы уверены?</div>
        <div class="confirm-message" id="confirmMessageProfile">Удалить этот пост?</div>
        <div class="confirm-actions">
            <button class="confirm-btn confirm-cancel" id="confirmCancelProfile">Отмена</button>
            <button class="confirm-btn confirm-ok" id="confirmOkProfile">Да, удалить</button>
        </div>
    </div>
</div>
<script src="profile1.js"></script>
</body>
</html>
